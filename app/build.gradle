plugins {
    id 'com.android.application'
}

android {
    namespace 'de.kerim.tvmapper'
    compileSdk 34

    defaultConfig {
        applicationId 'de.kerim.tvmapper'
        minSdk 24
        targetSdk 34
        def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode runNo
        versionName "1.${runNo}"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'tvmapper'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
